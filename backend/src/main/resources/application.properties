spring.application.name=menu-planner

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:meal_planner}
spring.datasource.username=${DB_USERNAME:meal_planner}
spring.datasource.password=${DB_PASSWORD:meal_planner}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:changeme}

# A backup export/import of real recipe data is well over Spring's 1MB/10MB defaults.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
